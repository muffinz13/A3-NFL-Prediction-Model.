
name: A3 NFL Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  update-nfl-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ======================================
      # SETUP
      # ======================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "pandas>=2.2,<3" "pyarrow>=17,<24" requests
          pip install "scikit-learn>=1.5,<2" numpy

      # ======================================
      # DOWNLOAD NFL DATA
      # ======================================

      - name: Download NFL play-by-play data
        run: |
          mkdir -p data
          python - <<'PY'
          import requests
          from pathlib import Path

          for year in [2024, 2025, 2026]:
              url = (
                  "https://github.com/nflverse/nflverse-data/"
                  f"releases/download/pbp/play_by_play_{year}.parquet"
              )

              response = requests.get(
                  url,
                  timeout=180
              )

              response.raise_for_status()

              output = Path(
                  f"data/play_by_play_{year}.parquet"
              )

              output.write_bytes(
                  response.content
              )

              print(
                  f"Downloaded {year}: "
                  f"{output.stat().st_size:,} bytes"
              )
          PY

      # ======================================
      # BUILD A3 PLAYER AND DEFENSE FEATURES
      # ======================================

      - name: Build A3 defensive matchup features
        run: python scripts/build_features.py

      - name: Build A3 player performance features
        run: python scripts/build_player_features.py

      - name: Build A3 matchup intelligence features
        run: python scripts/build_matchup_features.py

      # ======================================
      # PHASE 4.2
      # POSITION-SPECIFIC DEFENSE
      # ======================================

      - name: Build position-specific defensive features
        run: python scripts/build_position_matchups.py

      # ======================================
      # PHASE 4.4
      # DEFENSIVE VULNERABILITIES
      # ======================================

      - name: Build defensive vulnerability profiles
        run: python scripts/build_vulnerability_features.py

      # ======================================
      # TRAIN BASELINE A3 MODELS
      # ======================================

      - name: Train and backtest A3 prediction models
        run: python scripts/train_a3.py

      # ======================================
      # DEFENSIVE MATCHUP VALIDATION
      # ======================================

      - name: Validate defensive matchup value
        run: python scripts/validate_matchups.py

      # ======================================
      # PHASE 4.3 VALIDATION
      # ======================================

      - name: Validate position-specific matchup value
        run: python scripts/validate_position_matchups.py

      # ======================================
      # PHASE 4.5 VALIDATION
      # ======================================

      - name: Validate Phase 4.4 vulnerabilities
        run: python scripts/validate_vulnerabilities.py

      # ======================================
      # PHASE 4.6
      # SELECT DEFENSIVE FEATURES BY POSITION
      # ======================================

      - name: Validate Phase 4.6 feature selection
        run: python scripts/validate_feature_selection.py

      # ======================================
      # VERIFY ALL OUTPUT FILES
      # ======================================

      - name: Verify A3 outputs
        run: |
          test -s data/processed/defense_game_features.csv
          test -s data/processed/defense_pregame_features.csv
          test -s data/processed/player_game_stats.csv
          test -s data/processed/player_pregame_features.csv
          test -s data/processed/player_matchup_features.csv
          test -s data/processed/defense_position_game_features.csv
          test -s data/processed/player_position_matchup_features.csv
          test -s data/processed/defense_vulnerability_game_features.csv
          test -s data/processed/player_vulnerability_matchup_features.csv

          test -s data/model_results/a3_backtest_report.json
          test -s data/model_results/a3_backtest_predictions.csv

          test -s data/model_results/a3_matchup_validation.json
          test -s data/model_results/a3_matchup_validation_predictions.csv

          test -s data/model_results/a3_position_validation.json
          test -s data/model_results/a3_position_validation_predictions.csv

          test -s data/model_results/a3_vulnerability_validation.json
          test -s data/model_results/a3_vulnerability_validation_predictions.csv

          test -s data/model_results/a3_feature_selection_validation.json
          test -s data/model_results/a3_feature_selection_predictions.csv

      # ======================================
      # UPLOAD DATASETS AND MODEL RESULTS
      # ======================================

      - name: Upload A3 datasets and model results
        uses: actions/upload-artifact@v4
        with:
          name: a3-nfl-data-and-model-results
          path: |
            data/*.parquet
            data/processed/*.csv
            data/model_results/*.json
            data/model_results/*.csv
          retention-days: 7
          if-no-files-found: error
